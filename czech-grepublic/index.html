<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The page has its own dark design (style.css). Declaring it stops browsers
       that auto-darken pages (Chrome on Android, Samsung Internet, in-app browsers)
       from darkening it themselves, which left the logo image's dark text on a
       dark background. -->
  <meta name="color-scheme" content="light dark">
  <title>Czech grepublic – ulice a obce Česka</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- Texts are Czech; app.js swaps them for English (keys in its I18N table)
       when English is chosen with the CS/EN switch. -->
  <div id="sidebar">
    <header id="brand">
      <div id="logo" class="text-logo" role="img" aria-label="/czech grepublic/">
        <img src="assets/favicon-192.png" alt="" width="192" height="192">
        <span aria-hidden="true">/czech <b>g</b>republic/</span>
      </div>
      <div id="lang" role="group" aria-label="Jazyk" data-i18n-label="langGroup">
        <button type="button" data-lang="cs" lang="cs" title="Čeština">CS</button>
        <button type="button" data-lang="en" lang="en" title="English">EN</button>
      </div>
    </header>

    <!-- Phones only: the sidebar becomes a bottom sheet; this toggles it. -->
    <button id="sheet-handle" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="Rozbalit panel"></button>

    <div id="panel">
      <!-- Search groups: one row per pattern, each highlighted in its own colour
           on the map. app.js renders the rows; this first one is the default. -->
      <div id="groups">
        <div class="search-row">
          <span class="gdot" aria-hidden="true"></span>
          <input class="q" type="search" placeholder="Ulice nebo obec, třeba i regulární výraz, např. ^Lhota" data-i18n-placeholder="placeholder" autocomplete="off" spellcheck="false" autofocus>
          <span class="gcount"></span>
        </div>
      </div>
      <button id="add-group" type="button" class="add-group"><span class="plus" aria-hidden="true">+</span><span data-i18n="addGroup">Přidat skupinu</span></button>
      <!-- What to search (both kinds, only streets, or only municipalities), and
           on the right the Aa / ě match toggles (checkboxes drawn as small pills). -->
      <div class="scope-row">
        <div id="scope" class="scope" role="radiogroup" aria-label="Hledat" data-i18n-label="scopeGroup">
          <label><input type="radio" name="scope" value="s"><span data-i18n="scopeStreets">Ulice</span></label>
          <label><input type="radio" name="scope" value="both" checked><span data-i18n="scopeBoth">Obojí</span></label>
          <label><input type="radio" name="scope" value="m"><span data-i18n="scopeMunis">Obce</span></label>
        </div>
        <label class="toggle" title="Rozlišovat VELKÁ/malá" data-i18n-title="matchCase"><input type="checkbox" id="opt-case" aria-label="Rozlišovat VELKÁ/malá" data-i18n-label="matchCase"><span aria-hidden="true">Aa</span></label>
        <label class="toggle" title="Rozlišovat diakritiku" data-i18n-title="matchDia"><input type="checkbox" id="opt-diacritics" aria-label="Rozlišovat diakritiku" data-i18n-label="matchDia"><span aria-hidden="true">ě</span></label>
      </div>
      <!-- Match counts, "zobrazit vše" and "uložit ☆" (app.js). -->
      <div id="status" data-i18n="loading">Načítám data…</div>
      <ul id="results"></ul>
    </div>

    <section id="starred-box" class="box">
      <h2 data-i18n="starredTitle">Oblíbené</h2>
      <p id="starred-empty" data-i18n="starredEmpty">Vzor uložíte kliknutím na „uložit ☆“ u výsledků.</p>
      <div id="starred" class="pills"></div>
    </section>

    <section id="intro" class="box">
      <h2 data-i18n="introTitle">Jste tu poprvé?</h2>
      <p data-i18n="introText">Klikněte na vzor a vyzkoušejte ho:</p>
      <div id="suggestions" class="pills"></div>
      <!-- Only the first three rows of pills show until this is clicked (app.js). -->
      <button id="sugg-more" type="button" class="more-toggle" hidden>+ ukázat více</button>
    </section>
  </div>

  <div id="tooltip" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <!-- Reads map tiles straight out of data/cz.pmtiles with HTTP range requests. -->
  <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
  <script src="app.js"></script>
</body>
</html>
