<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clustra</title>
<style>
:root{
  --bg:#f4f5f7; --dot:#d3d7dd; --panel:#ffffff; --text:#1c2024; --muted:#6b7280; --border:#e2e5e9;
  --node:#ffffff; --node-stroke:#c3c9d2; --accent:#3b5bdb; --danger:#d93a40; --hover:#f0f2f5;
  --link:#8b93a0;
  --shadow:0 2px 10px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181b; --dot:#2c3036; --panel:#1f2226; --text:#e8eaed; --muted:#9aa1ab; --border:#33373d;
    --node:#272b30; --node-stroke:#50565f; --accent:#7c9cff; --danger:#ff6b70; --hover:#2a2e33;
    --link:#8a919d;
    --shadow:0 2px 12px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
svg#cv{position:fixed;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;touch-action:none;cursor:default;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px)}
svg#cv.panning{cursor:grabbing}
svg text{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:var(--text);pointer-events:none}
.hull{opacity:.45;stroke-linejoin:round;stroke-width:48} /* the palette is pastel, so the areas can be fairly opaque */
.hull.sel{opacity:.75}
svg g.glabel{cursor:move;pointer-events:auto}
svg g.glabel text{font-weight:700;font-size:15px;pointer-events:none}
svg g.glabel.sub text{font-size:12px}
svg g.glabel rect{fill:transparent;pointer-events:all}
svg .hull.sel{cursor:move}
.chip.implied{border-style:dashed;font-weight:400}
.chip.newgroup{border-style:dashed;color:var(--accent);font-weight:600}
.chip.newgroup:hover{background:var(--hover)}
.chip input{border:none;background:none;padding:0;width:130px;outline:none;font:inherit}
.ghandle{fill:var(--accent);stroke:var(--node);stroke-width:2;cursor:crosshair}
.lp{flex:none}
.joint{fill:var(--bg);stroke:var(--accent);stroke-width:2.5;cursor:move}
.pickrow{display:flex;gap:8px}
.pick{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 8px;cursor:pointer;min-width:0}
.pick:hover{border-color:var(--muted)}
.pick::after{content:'';border:4px solid transparent;border-top-color:var(--muted);border-bottom:0;margin-left:2px}
.endlbl{display:flex;align-items:center;gap:6px;white-space:nowrap}
.endlbl span.nm{max-width:38%;overflow:hidden;text-overflow:ellipsis}
.endlbl span.fill{flex:1;border-top:1px dashed var(--border);min-width:8px}
#pop button.opt{justify-content:center}
.hint{color:var(--muted);font-size:11px;margin-top:6px}
.node{cursor:pointer}
.node rect{fill:var(--node);stroke:var(--node-stroke);stroke-width:1.2}
.node:hover rect{stroke:var(--accent)}
.node.sel rect{stroke:var(--accent);stroke-width:2.5}
.node.dim{opacity:.25}
.node.hit rect{stroke:var(--accent);stroke-width:2.5}
.handle{fill:var(--accent);stroke:var(--node);stroke-width:2;opacity:0;cursor:crosshair}
.node:hover .handle,.node.sel .handle{opacity:1}
.link{cursor:pointer}
.link .hitbox{stroke:transparent;stroke-width:14;fill:none}
.link .vis{fill:none;stroke-width:1.8;stroke-linecap:round}
.link.dim{opacity:.18}
.link.sel .vis{stroke-width:4}
.link text{font-size:11px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.link .vis{stroke:var(--link)}
.link text{fill:var(--muted)}
#temp{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4;pointer-events:none}

.panel{position:fixed;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
#brand{display:flex;align-items:center;gap:9.4px;pointer-events:none;user-select:none;-webkit-user-select:none}
#brand .logo{display:block;height:34.6px;width:auto;-webkit-user-drag:none}
#side{left:12px;top:12px;width:290px;max-height:calc(100% - 24px);display:flex;flex-direction:column;padding:12px}
#side h1{font-size:15px;margin:0}
.sidehead{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
#sidetoggle{width:34px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--text);background:none;border:none;border-radius:8px;margin:-4px -4px -4px 0}
#sidetoggle:hover{background:none;color:var(--accent)}
#side.collapsed .sidehead{margin:0 0 12px}
#side.collapsed #search,#side.collapsed #lists{display:none}
#side.collapsed .stats{margin-top:0}
#lists{overflow:auto;flex:1;margin:6px -6px 0;padding:0 6px}
#lists .lbl{position:sticky;top:0;background:var(--panel);margin:0;padding:8px 0 4px;z-index:1}
#lists .lbl span{text-transform:none;letter-spacing:0}
#glist,#ilist{list-style:none;margin:0 -6px;padding:0}
#glist li,#ilist li{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer}
#ilist li span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#glist li:hover,#ilist li:hover{background:var(--hover)}
#glist li.on,#ilist li.on{background:var(--hover);font-weight:600}
#glist .cnt{margin-left:auto;color:var(--muted);font-weight:400}
#ilist .none{background:none;border:1.5px solid var(--muted)}
.none-msg{color:var(--muted);padding:4px 8px}
.hull.hit{opacity:.75}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 4px}
.stats{color:var(--muted);font-size:12px;margin-top:8px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=search],select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
button{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{background:var(--hover)}
button.danger{color:var(--danger)}
button.x{border:none;background:none;padding:0 4px;color:var(--muted);font-size:15px;line-height:1}
button.x:hover{color:var(--danger)}
#topright{position:fixed;right:12px;top:12px;display:flex;align-items:center;gap:18px}
#tools{position:static;display:flex;gap:6px;padding:6px}
#tools button{border-color:transparent;display:inline-flex;align-items:center;gap:6px}
#tools .ico{font-size:20px;line-height:1}
#pop .sep{height:1px;background:var(--border);margin:4px 2px}
.menunote{padding:6px 10px;max-width:260px;color:var(--muted);font-size:12px}
#insp{right:12px;top:64px;width:312px;max-height:calc(100% - 130px);overflow:auto;padding:12px}
#insp[hidden]{display:none}
#insp .title{font-size:15px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;color:var(--muted)}
.chip.on{color:var(--text);border-color:var(--text);font-weight:600}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:6px;padding:3px 0}
.list li span.grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list a{color:inherit;text-decoration:none;cursor:pointer;font-weight:600}
.list a:hover{color:var(--accent)}
.row{display:flex;gap:6px;margin-top:6px}
.seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--bg);padding:5px 6px;cursor:pointer;font-size:12px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent);color:#fff}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid transparent}
.swatches button.on{border-color:var(--text)}
.foot{margin-top:14px;display:flex;justify-content:space-between;gap:6px}
#zoom{right:12px;bottom:12px;display:flex;align-items:center;gap:2px;padding:4px}
#zoom button{border:none;min-width:30px}
label.chk{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;white-space:nowrap;cursor:pointer}
label.chk input{width:auto;margin:0;flex:none}
label.chk.wrap{white-space:normal;align-items:flex-start;line-height:1.35}
label.chk.wrap input{margin-top:2px}
.newtype{display:flex;gap:8px;align-items:center;padding:4px}
.newtype input[type=text]{width:150px}
.filerow{flex:1;min-width:0;display:flex;align-items:center;gap:9px;text-align:left;background:none;border:none;padding:3px 6px;margin:-3px 0 -3px -6px;border-radius:6px}
.filerow:hover{background:var(--hover)}
.fcol{display:flex;flex-direction:column;min-width:0;line-height:1.25}
#side .fname,#tools .fname{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side .fstat{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncdot{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)}
.syncdot.ok{background:#22C55E;border-color:#22C55E}
.syncdot.busy{background:#e2a400;border-color:#e2a400;animation:pulse 1s ease-in-out infinite}
.syncdot.bad{background:var(--danger);border-color:var(--danger)}
@keyframes pulse{50%{opacity:.35}}
#pop{padding:6px;display:flex;flex-direction:column;gap:2px;z-index:5}
#pop button{border:none;text-align:left;display:flex;align-items:center;gap:8px}
#nameinp{position:fixed;width:180px;z-index:6;transform:translate(-50%,-50%);background:var(--panel)!important;box-shadow:var(--shadow)}
#marq{position:fixed;border:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);pointer-events:none;z-index:4}
#exp{left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 24px));padding:16px;z-index:50}
#exp .prev{margin:10px 0 4px;height:170px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:conic-gradient(var(--hover) 25%,transparent 0 50%,var(--hover) 0 75%,transparent 0) 0 0/16px 16px}
#exp .prev img{max-width:100%;max-height:100%;display:block}
#exp .go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#exphint{left:50%;top:14px;transform:translateX(-50%);padding:8px 8px 8px 14px;display:flex;align-items:center;gap:12px;z-index:55}
body.exportsel svg#cv{cursor:crosshair}
#printsheet{display:none}
@media print{
  body>*:not(#printsheet){display:none!important}
  html,body{height:auto;overflow:visible;background:#fff!important}
  #printsheet{display:block;position:fixed;inset:0}
  #printsheet svg{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#toast{left:50%;bottom:60px;transform:translateX(-50%);padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#empty{left:50%;top:50%;transform:translate(-50%,-50%);padding:22px 26px;text-align:center;max-width:380px}
#empty h2{margin:0 0 6px;font-size:16px}
#empty p{color:var(--muted);margin:0 0 14px}
#samples{display:flex;flex-direction:column;gap:6px}
kbd{border:1px solid var(--border);border-radius:4px;padding:0 4px;font:inherit;font-size:11px}
.mobile-only,#tools .mobile-only{display:none}
.sheetx{position:fixed;top:12px;right:12px;width:40px;height:40px;z-index:40;display:none;align-items:center;justify-content:center;padding:0;border-radius:50%;background:var(--hover);border:1px solid var(--border)}
.iconbtn{width:34px;height:30px;padding:0;align-items:center;justify-content:center;border-color:transparent;background:none}
#pop{z-index:45}
#toast{z-index:60}
/* Phones and other narrow screens */
@media (max-width: 720px){
  /* the logo goes to the bottom-left corner */
  #brand{position:fixed;left:12px;bottom:12px}
  /* the file row and the actions are one panel across the top; the summary is dropped */
  #topright{left:12px;max-width:none}
  #tools{flex:1;min-width:0;gap:2px;padding:4px}
  #tools .mobile-only{display:flex}
  #tools #filerow2{flex:1 1 90px;min-width:44px;margin:0;padding:4px 6px}
  #tools button{white-space:nowrap;padding:6px 6px}
  #tools .ico{font-size:16px}
  /* the lists open as a sheet over the whole page */
  #side{display:none}
  #side.sheet{display:flex;left:0;top:0;right:0;bottom:0;width:auto;max-height:none;border-radius:0;border:none;padding:16px;z-index:25}
  #side.sheet #sidetoggle{display:none}
  #side.sheet .sidehead{padding-right:52px}
  body.sheet-left #sheetclose,body.sheet-insp #inspclose{display:flex}
  /* the selection panel too */
  #insp:not([hidden]){left:0;top:0;right:0;bottom:0;width:auto;max-height:none;border-radius:0;border:none;padding:64px 16px 24px;z-index:25}
}
@media (max-width: 360px){ #tools .ico{display:none} }
</style>
</head>
<body>
<svg id="cv">
  <defs>
    <marker id="m-arrow" viewBox="-22 -9 24 18" refX="0" refY="0" markerWidth="24" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M-13-5.5L0 0-13 5.5z" style="fill:var(--link);stroke:var(--link);stroke-width:1;stroke-linejoin:round"/></marker>
    <marker id="m-hollow" viewBox="-22 -9 24 18" refX="0" refY="0" markerWidth="24" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M-13-5.5L0 0-13 5.5z" style="fill:var(--bg);stroke:var(--link);stroke-width:1.6;stroke-linejoin:round"/></marker>
    <marker id="m-open" viewBox="-22 -9 24 18" refX="0" refY="0" markerWidth="24" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M-12-6L0 0-12 6" style="fill:none;stroke:var(--link);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"/></marker>
    <marker id="m-diamond" viewBox="-22 -9 24 18" refX="0" refY="0" markerWidth="24" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M-20 0L-10-5.5 0 0-10 5.5z" style="fill:var(--link);stroke:var(--link);stroke-width:1;stroke-linejoin:round"/></marker>
    <marker id="m-hollowdiamond" viewBox="-22 -9 24 18" refX="0" refY="0" markerWidth="24" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M-20 0L-10-5.5 0 0-10 5.5z" style="fill:var(--bg);stroke:var(--link);stroke-width:1.6;stroke-linejoin:round"/></marker>
  </defs>
  <g id="world"><g id="root"></g><line id="temp" visibility="hidden"/></g>
</svg>

<div id="side" class="panel">
  <div class="sidehead"><button id="filerow" class="filerow"><span class="syncdot"></span><span class="fcol"><span class="fname"></span><span class="fstat"></span></span></button><button class="x" id="sidetoggle" title="Collapse the panel" aria-label="Collapse the panel"></button></div>
  <input type="search" id="search" placeholder="Search…  ( / )">
  <div id="lists">
    <div class="lbl">Groups <span id="gcount"></span></div>
    <ul id="glist"></ul>
    <div class="lbl">Items <span id="icount"></span></div>
    <ul id="ilist"></ul>
  </div>
  <div class="stats" id="stats"></div>
</div>

<script>
const KEY = 'clustra-v1';
// A group colour for text and thin lines: the pastel mixed towards the text colour, so it stays readable.
// A group stores the NUMBER of its colour in the palette, not the colour itself.
const cssColor = g => PALETTE[g?.color] ?? '#888';
const colorIndex = v => { // a valid number is kept; anything else (e.g. a hex string) becomes the nearest palette colour
  if (Number.isInteger(v) && v >= 0 && v < PALETTE.length) return v;
  const rgb = h => [1, 3, 5].map(i => parseInt(String(h).slice(i, i + 2), 16));
  const t = rgb(v); if (!/^#[0-9a-f]{6}$/i.test(String(v))) return 0;
  let best = 0, bd = Infinity; PALETTE.forEach((p, i) => { const d = rgb(p).reduce((s, c, k) => s + (c - t[k]) ** 2, 0); if (d < bd) { bd = d; best = i; } });
  return best;
};
const ink = c => `color-mix(in srgb, ${c} 45%, var(--text))`;
const PALETTE = ['#F4A7A7','#F7BE95','#F5D88E','#BBDDA5','#91D4BB','#91D9E5','#A5C7F5','#B9B1F0','#E5A8D1','#B9BFC9'];
const NH = 30;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const svg = $('#cv'), world = $('#world'), root = $('#root'), temp = $('#temp'), insp = $('#insp'), pop = $('#pop');

// ---------- state ----------
function normalize(d) {
  d = d && typeof d === 'object' ? d : {};
  const S = {
    name: typeof d.name === 'string' ? d.name : '',
    items: Array.isArray(d.items) ? d.items : [],
    groups: Array.isArray(d.groups) ? d.groups : [],
    links: Array.isArray(d.links) ? d.links : [],
    linkTypes: (Array.isArray(d.linkTypes) ? d.linkTypes : []).filter(t => t && t.id).map(t => ({id: String(t.id), name: String(t.name || 'Connection'), line: LINES.includes(t.line) ? t.line : 'solid', start: ENDS.includes(t.start) ? t.start : 'none', end: ENDS.includes(t.end) ? t.end : t.dir ? 'arrow' : 'none'})), // older files: dir -> an arrow at the end
    view: d.view && isFinite(d.view.k) ? d.view : null,
    savedAt: +d.savedAt || 0,

function toMarkdown() { // "# graph name", then "## group", "### subgroup", one item per line, connections
  const out = ['# ' + graphTitle()], byId = new Map(S.items.map(p => [p.id, p]));
  const line = p => p.name + (p.note ? ' - ' + p.note.trim().replace(/\s*\n\s*/g, ' / ') : '');
  const walk = (g, depth) => {
    out.push('', '#'.repeat(depth + 1) + ' ' + g.name);
    for (const p of S.items) if (p.groups.includes(g.id)) out.push(line(p));
    S.groups.filter(c => c.parent === g.id).forEach(c => walk(c, depth + 1));
  };
  S.groups.filter(g => !g.parent).forEach(g => walk(g, 1));
  const loose = S.items.filter(p => !p.groups.length);
  if (loose.length) { out.push('', '## (no group)'); loose.forEach(p => out.push(line(p))); }
  if (S.links.length) {
    out.push('', '## Connections');
    const nm = id => byId.get(id)?.name ?? `${group(id).name} (group)`;
    for (const l of S.links) { const d = dirOf(typeOf(l.type)); out.push(`- ${nm(l.a)} ${d === 'ab' ? '→' : d === 'ba' ? '←' : '—'} ${nm(l.b)} (${typeName(l.type)}${l.label ? ': ' + l.label : ''})`); }
