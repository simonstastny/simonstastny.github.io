<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clustra</title>
<style>
:root{
  --bg:#f4f5f7; --dot:#d3d7dd; --panel:#ffffff; --text:#1c2024; --muted:#6b7280; --border:#e2e5e9;
  --node:#ffffff; --node-stroke:#c3c9d2; --accent:#3b5bdb; --danger:#d93a40; --hover:#f0f2f5;
  --link:#8b93a0;
  --shadow:0 2px 10px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181b; --dot:#2c3036; --panel:#1f2226; --text:#e8eaed; --muted:#9aa1ab; --border:#33373d;
    --node:#272b30; --node-stroke:#50565f; --accent:#7c9cff; --danger:#ff6b70; --hover:#2a2e33;
    --link:#8a919d;
    --shadow:0 2px 12px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
svg#cv{position:fixed;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px)}
svg#cv.panning{cursor:grabbing}
svg text{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:var(--text);pointer-events:none}
.hull{opacity:.15;stroke-linejoin:round;stroke-width:48}
.hull.sel{opacity:.3}
svg text.glabel{font-weight:700;font-size:15px;pointer-events:auto;cursor:move}
svg text.glabel.sub{font-size:12px}
.chip.implied{border-style:dashed;font-weight:400}
.chip.newgroup{border-style:dashed;color:var(--accent);font-weight:600}
.chip.newgroup:hover{background:var(--hover)}
.chip input{border:none;background:none;padding:0;width:130px;outline:none;font:inherit}
.chip.weak{border-style:dotted;border-width:2px;color:var(--text)}
.weakline{pointer-events:none}
.weakline path{fill:none;stroke-width:3;stroke-dasharray:1 8;stroke-linecap:round}
.weakline.dim{opacity:.25}
.hint{color:var(--muted);font-size:11px;margin-top:6px}
.node{cursor:pointer}
.node rect{fill:var(--node);stroke:var(--node-stroke);stroke-width:1.2}
.node:hover rect{stroke:var(--accent)}
.node.sel rect{stroke:var(--accent);stroke-width:2.5}
.node.dim{opacity:.25}
.node.hit rect{stroke:var(--accent);stroke-width:2.5}
.handle{fill:var(--accent);stroke:var(--node);stroke-width:2;opacity:0;cursor:crosshair}
.node:hover .handle,.node.sel .handle{opacity:1}
.link{cursor:pointer}
.link .hitbox{stroke:transparent;stroke-width:14;fill:none}
.link .vis{fill:none;stroke-width:1.8;stroke-linecap:round}
.link.dim{opacity:.18}
.link.sel .vis{stroke-width:4}
.link text{font-size:11px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.link .vis{stroke:var(--link)}
.link text{fill:var(--muted)}
#temp{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4;pointer-events:none}

.panel{position:fixed;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
#brand{display:flex;align-items:center;gap:9.4px;pointer-events:none;user-select:none;-webkit-user-select:none}
#brand .mark{display:block;width:34.6px;height:34.6px;-webkit-user-drag:none}

@media (prefers-color-scheme: dark){#brand .word{background:var(--text)}}
#side{left:12px;top:12px;width:290px;max-height:calc(100% - 24px);display:flex;flex-direction:column;padding:12px}
#side h1{font-size:15px;margin:0}
.sidehead{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
#sidetoggle{width:34px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--text);background:none;border:none;border-radius:8px;margin:-4px -4px -4px 0}
#sidetoggle:hover{background:none;color:var(--accent)}
#side.collapsed .sidehead{margin:0 0 12px}
#side.collapsed #search,#side.collapsed #lists{display:none}
#side.collapsed .stats{margin-top:0}
#lists{overflow:auto;flex:1;margin:6px -6px 0;padding:0 6px}
#lists .lbl{position:sticky;top:0;background:var(--panel);margin:0;padding:8px 0 4px;z-index:1}
#lists .lbl span{text-transform:none;letter-spacing:0}
#glist,#ilist{list-style:none;margin:0 -6px;padding:0}
#glist li,#ilist li{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer}
#ilist li span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#glist li:hover,#ilist li:hover{background:var(--hover)}
#glist li.on,#ilist li.on{background:var(--hover);font-weight:600}
#glist .cnt{margin-left:auto;color:var(--muted);font-weight:400}
#ilist .none{background:none;border:1.5px solid var(--muted)}
.none-msg{color:var(--muted);padding:4px 8px}
.hull.hit{opacity:.32}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 4px}
.stats{color:var(--muted);font-size:12px;margin-top:8px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=search],select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
button{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{background:var(--hover)}
button.danger{color:var(--danger)}
button.x{border:none;background:none;padding:0 4px;color:var(--muted);font-size:15px;line-height:1}
button.x:hover{color:var(--danger)}
#topright{position:fixed;right:12px;top:12px;display:flex;align-items:center;gap:18px}
#tools{position:static;display:flex;gap:6px;padding:6px}
#tools button{border-color:transparent;display:inline-flex;align-items:center;gap:6px}
#tools .ico{font-size:20px;line-height:1}
#pop .sep{height:1px;background:var(--border);margin:4px 2px}
.menunote{padding:6px 10px;max-width:260px;color:var(--muted);font-size:12px}
#insp{right:12px;top:64px;width:312px;max-height:calc(100% - 130px);overflow:auto;padding:12px}
#insp[hidden]{display:none}
#insp .title{font-size:15px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;color:var(--muted)}
.chip.on{color:var(--text);border-color:var(--text);font-weight:600}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:6px;padding:3px 0}
.list li span.grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list a{color:inherit;text-decoration:none;cursor:pointer;font-weight:600}
.list a:hover{color:var(--accent)}
.row{display:flex;gap:6px;margin-top:6px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid transparent}
.swatches button.on{border-color:var(--text)}
.foot{margin-top:14px;display:flex;justify-content:space-between;gap:6px}
#zoom{right:12px;bottom:12px;display:flex;align-items:center;gap:2px;padding:4px}
#zoom button{border:none;min-width:30px}
label.chk{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;white-space:nowrap;cursor:pointer}
label.chk input{width:auto;margin:0}
.newtype{display:flex;gap:8px;align-items:center;padding:4px}
.newtype input[type=text]{width:150px}
.filerow{flex:1;min-width:0;display:flex;align-items:center;gap:9px;text-align:left;background:none;border:none;padding:3px 6px;margin:-3px 0 -3px -6px;border-radius:6px}
.filerow:hover{background:var(--hover)}
.fcol{display:flex;flex-direction:column;min-width:0;line-height:1.25}
#fname{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fstat{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncdot{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)}
.syncdot.ok{background:#30a46c;border-color:#30a46c}
.syncdot.busy{background:#e2a400;border-color:#e2a400;animation:pulse 1s ease-in-out infinite}
.syncdot.bad{background:var(--danger);border-color:var(--danger)}
@keyframes pulse{50%{opacity:.35}}
#pop{padding:6px;display:flex;flex-direction:column;gap:2px;z-index:5}
#pop button{border:none;text-align:left;display:flex;align-items:center;gap:8px}
#nameinp{position:fixed;width:180px;z-index:6;transform:translate(-50%,-50%);background:var(--panel)!important;box-shadow:var(--shadow)}
#marq{position:fixed;border:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);pointer-events:none;z-index:4}
#toast{left:50%;bottom:60px;transform:translateX(-50%);padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#empty{left:50%;top:50%;transform:translate(-50%,-50%);padding:22px 26px;text-align:center;max-width:380px}
#empty h2{margin:0 0 6px;font-size:16px}
#empty p{color:var(--muted);margin:0 0 14px}
kbd{border:1px solid var(--border);border-radius:4px;padding:0 4px;font:inherit;font-size:11px}
</style>
</head>
<body>
<svg id="cv">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" style="fill:var(--link)"/>
    </marker>
  </defs>
  <g id="world"><g id="root"></g><line id="temp" visibility="hidden"/></g>
</svg>

<div id="side" class="panel">
  <div class="sidehead"><button id="filerow" class="filerow"><span id="syncdot" class="syncdot"></span><span class="fcol"><span id="fname"></span><span id="fstat"></span></span></button><button class="x" id="sidetoggle" title="Collapse the panel" aria-label="Collapse the panel"></button></div>
  <input type="search" id="search" placeholder="Search…  ( / )">
  <div id="lists">
    <div class="lbl">Groups <span id="gcount"></span></div>
    <ul id="glist"></ul>
    <div class="lbl">Items <span id="icount"></span></div>
    <ul id="ilist"></ul>
  </div>
  <div class="stats" id="stats"></div>

<script>
const KEY = 'clustra-v1';
const PALETTE = ['#e5484d','#f76b15','#e2a400','#30a46c','#12a594','#0090ff','#6e56cf','#d6409f','#8d6e53','#687076'];
const NH = 30;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const svg = $('#cv'), world = $('#world'), root = $('#root'), temp = $('#temp'), insp = $('#insp'), pop = $('#pop');

// ---------- state ----------
function normalize(d) {
  d = d && typeof d === 'object' ? d : {};
  const S = {
    name: typeof d.name === 'string' ? d.name : '',
    items: Array.isArray(d.items) ? d.items : [],
    groups: Array.isArray(d.groups) ? d.groups : [],
    links: Array.isArray(d.links) ? d.links : [],
    linkTypes: (Array.isArray(d.linkTypes) ? d.linkTypes : []).filter(t => t && t.id).map(t => ({id: String(t.id), name: String(t.name || 'Connection'), dir: !!t.dir})),
    view: d.view && isFinite(d.view.k) ? d.view : null,
    savedAt: +d.savedAt || 0,
  };
  const gids = new Set(S.groups.map(g => g.id));
  S.groups.forEach(g => { g.parent = g.parent && g.parent !== g.id && gids.has(g.parent) ? g.parent : null; });
  S.groups.forEach(g => { const seen = new Set([g.id]); let x = g; while (x && x.parent) { if (seen.has(x.parent)) { x.parent = null; break; } seen.add(x.parent); x = S.groups.find(y => y.id === x.parent); } });
  S.items.forEach(p => { p.groups = (p.groups || []).filter(g => gids.has(g)); p.weak = (p.weak || []).filter(g => gids.has(g) && !p.groups.includes(g)); p.x = +p.x || 0; p.y = +p.y || 0; p.name = String(p.name || '?'); });
  const itemIds = new Set(S.items.map(p => p.id));
  S.links = S.links.filter(l => itemIds.has(l.a) && itemIds.has(l.b) && l.a !== l.b);
  for (const l of S.links) {
    l.type = String(l.type);
    if (!S.linkTypes.some(t => t.id === l.type)) S.linkTypes.push({id: l.type, name: 'Connection', dir: false}); // a link whose type is missing from the file
  }
  S.linkTypes = S.linkTypes.filter(t => S.links.some(l => l.type === t.id));

// ---------- operations ----------
function addItem(name, opt = {}) {

  let c;

  else if (opt.near) c = {x: opt.near.x, y: opt.near.y + 60};
  else {
    const ms = p.groups.length ? members(p.groups[0]) : [];
    const up = p.groups.length ? ancestors(p.groups[0]).map(members).find(a => a.length) : null;
    if (ms.length) c = centroid(ms);
    else if (up) { const b = bbox(up); c = {x: b.x1 + 90, y: (b.y0 + b.y1) / 2}; }
    else if (S.items.length && p.groups.length) { const b = bbox(); c = {x: b.x1 + 260, y: (b.y0 + b.y1) / 2}; }
    else c = toWorld(innerWidth / 2, innerHeight / 2);

function addLink(a, b, type, label = '') {

  const l = {id: uid(), a, b, type, label}; S.links.push(l); return l;
}

let editing = false, lastConnType = null;
const connType = () => typeOf(lastConnType) ? lastConnType : (lastConnType === '__new' || !S.linkTypes.length ? '__new' : S.linkTypes[0].id);

  if (!editing) { pushUndo(); editing = true; }
  if (f === 'typeName' || f === 'typeDir') { // these belong to the connection's type, so they change every connection of that type
    const t = typeOf(o.type); if (!t) return;

  swap: () => mutate(() => { const l = getSel(); [l.a, l.b] = [l.b, l.a]; }),

}
// The file row opens this: autosave file, export, import and starting a new board.
function fileMenu(btn) {
  const top = !window.showSaveFilePicker ? '<div class="menunote">Saving to a file needs Chrome or Edge.</div>'
    : !fileHandle ? '<button data-f="new">Save to a new file…</button><button data-f="open">Open an existing file…</button>'
    : !fileOK ? `<button data-f="reconnect" class="danger">Reconnect ${esc(fileHandle.name)}</button><button data-f="unlink">Stop saving to this file</button>`
    : '<button data-f="now">Save now</button><button data-f="unlink">Stop saving to this file</button>';
  pop.innerHTML = top + '<div class="sep"></div><button data-f="json">Export as JSON</button><button data-f="md">Export as Markdown</button><button data-f="import">Import…</button><div class="sep"></div><button data-f="newboard" class="danger">New board…</button>';
  pop.style.minWidth = '230px'; placePop(btn);
  pop.onclick = async e => {
    const f = e.target.closest('[data-f]')?.dataset.f; if (!f) return;
    if (f === 'newboard') return confirmNewBoard(btn);
    pop.hidden = true;
    const types = [{description: 'Graph data', accept: {'application/json': ['.json']}}], stamp = new Date().toISOString().slice(0, 10);
    try {
      if (f === 'new') await linkFile(await showSaveFilePicker({suggestedName: slug() + '.json', types}), false);
      else if (f === 'open') await linkFile((await showOpenFilePicker({types}))[0], true);
      else if (f === 'now') await writeFile();
      else if (f === 'reconnect') { if (await fileHandle.requestPermission({mode: 'readwrite'}) === 'granted') { fileOK = true; sync.state = 'saved'; await syncFile(false); renderFileBtn(); } }
      else if (f === 'unlink') { fileHandle = null; fileOK = false; sync.state = 'saved'; await idb('readwrite', s => s.delete('file')).catch(() => {}); renderFileBtn(); }
      else if (f === 'json') download(`${slug()}-${stamp}.json`, JSON.stringify(serialize(), null, 2), 'application/json');
      else if (f === 'md') download(`${slug()}-${stamp}.md`, toMarkdown(), 'text/markdown');
      else if (f === 'import') $('#file').click();
    } catch (err) { if (err.name !== 'AbortError') toast('That did not work: ' + err.message); }
  };
}
// A new board never wipes anything that exists: the linked file is detached first and left exactly as it is.
function confirmNewBoard(btn) {
  if (!S.items.length && !S.groups.length && !fileHandle) { pop.hidden = true; return toast('The board is already empty'); }
  const msg = fileHandle ? `Start a new empty board? ${esc(fileHandle.name)} keeps the current board and stops being updated.`
    : `Start a new empty board? The current ${S.items.length} items are discarded — export first if you need them. Undo works until you reload.`;
  pop.innerHTML = `<div class="menunote">${msg}</div><button data-n="yes" class="danger">Yes, start a new board</button><button data-n="no">Cancel</button>`;
  placePop(btn);
  pop.onclick = async e => {
    const n = e.target.closest('[data-n]')?.dataset.n; if (!n) return;
    pop.hidden = true; if (n !== 'yes') return;
    const old = fileHandle;
    fileHandle = null; fileOK = false; sync.state = 'saved'; clearTimeout(fileT); // detach first, so nothing is written to the old file
    await idb('readwrite', s => s.delete('file')).catch(() => {});
    sel = null; multi.clear(); query = ''; $('#search').value = '';
    mutate(() => { S.items = []; S.groups = []; S.links = []; S.linkTypes = []; S.name = ''; });
    fit(); renderFileBtn();
    toast(old ? `New board — ${old.name} was left as it is` : 'New board — Undo brings the old one back');
  };
}
async function restoreFile() {
  try {
    const h = await idb('readonly', s => s.get('file')); if (!h) return;
    fileHandle = h;
    if (await h.queryPermission({mode: 'readwrite'}) === 'granted') { fileOK = true; await syncFile(false); }
  } catch {}
  renderFileBtn();
}

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function toMarkdown() { // "# graph name", then "## group", "### subgroup", one item per line, weak ties, connections
  const out = ['# ' + graphTitle()], byId = new Map(S.items.map(p => [p.id, p]));
  const line = p => p.name + (p.note ? ' - ' + p.note.trim().replace(/\s*\n\s*/g, ' / ') : '');
  const walk = (g, depth) => {
    out.push('', '#'.repeat(depth + 1) + ' ' + g.name);
    for (const p of S.items) if (p.groups.includes(g.id)) out.push(line(p));
    const weak = weakMembers(g.id);
    if (weak.length) out.push('', 'Weak ties: ' + weak.map(p => p.name).join(', '));
    S.groups.filter(c => c.parent === g.id).forEach(c => walk(c, depth + 1));
  };
  S.groups.filter(g => !g.parent).forEach(g => walk(g, 1));
  const loose = S.items.filter(p => !p.groups.length);
  if (loose.length) { out.push('', '## (no group)'); loose.forEach(p => out.push(line(p))); }
  if (S.links.length) {
    out.push('', '## Connections');
    for (const l of S.links) out.push(`- ${byId.get(l.a).name} ${typeOf(l.type)?.dir ? '→' : '—'} ${byId.get(l.b).name} (${typeName(l.type)}${l.label ? ': ' + l.label : ''})`);
  }
  return out.join('\n').trim() + '\n';
}
// ---------- toolbar ----------
$('#tools').addEventListener('click', e => {
  const t = e.target.closest('[data-tool]')?.dataset.tool;
  if (t === 'item') nameInput(innerWidth / 2, innerHeight / 2, sel?.kind === 'group' ? sel.id : '');
  else if (t === 'align') align();
  else if (t === 'undo') doUndo();
});
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  try {
    const d = JSON.parse(await f.text());
    importData(d);
  } catch (err) { toast('Import failed: ' + err.message); }
});
function importData(d) {
  const list = d.items;
  if (!Array.isArray(list)) throw new Error('not a graph file');
  const unplaced = list.length > 0 && list.every(p => p.x === undefined);
  pushUndo(); S = normalize(d); sel = null;
  if (unplaced) { S.view = {x: 0, y: 0, k: 1}; align(false); } // file has no positions yet: arrange it
  else { if (!S.view) S.view = {x: 0, y: 0, k: 1}; save(); renderAll(); fit(); }
  toast(`Imported ${S.items.length} items`);
}
$('#zoom').addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]')?.dataset.zoom, cx = innerWidth / 2, cy = innerHeight / 2;
  if (z === 'in') zoomAt(cx, cy, 1.25); else if (z === 'out') zoomAt(cx, cy, 0.8); else if (z === 'reset') zoomAt(cx, cy, 1 / S.view.k); else if (z === 'fit') fit();
});

// ---------- sample ----------
$('#load-sample').addEventListener('click', () => {
  const G = [['Frontend', 5], ['Backend', 3], ['Data', 6]].map(([name, c]) => ({id: uid(), name, color: PALETTE[c]}));
  const g = Object.fromEntries(G.map(x => [x.name, x.id]));
  const pipes = {id: uid(), name: 'Pipelines', color: PALETTE[6], parent: g['Data']}; G.push(pipes);
  const spec = {
    'Web app': ['Frontend'], 'Mobile app': ['Frontend'], 'Design system': ['Frontend'],
    'API gateway': ['Backend'], 'Auth service': ['Backend'], 'Billing': ['Backend'], 'Notifications': ['Backend'],
    'Warehouse': ['Data'], 'Dashboards': ['Data'], 'Nightly import': [pipes.id], 'Event stream': [pipes.id],
  };
  const byName = {};
  Object.entries(spec).forEach(([name, groups], i) => { const a = i * 2.4; byName[name] = {id: uid(), name, note: '', groups: groups.map(n => g[n] || n), weak: [], x: Math.cos(a) * 300, y: Math.sin(a) * 300}; });
  byName['Auth service'].weak = [g['Data']]; // a loose tie: it writes audit logs to the warehouse
  const T = [{id: uid(), name: 'depends on', dir: true}, {id: uid(), name: 'related to', dir: false}];
  const L = [['Web app', 'API gateway', 0], ['Mobile app', 'API gateway', 0], ['Web app', 'Design system', 0], ['API gateway', 'Auth service', 0], ['API gateway', 'Billing', 0],
    ['Billing', 'Notifications', 0], ['Dashboards', 'Warehouse', 0], ['Nightly import', 'Warehouse', 0], ['Event stream', 'Warehouse', 0], ['Billing', 'Event stream', 1]];
  pushUndo();
  S = normalize({name: '', items: Object.values(byName), groups: G, linkTypes: T, links: L.map(([a, b, t]) => ({id: uid(), a: byName[a].id, b: byName[b].id, type: T[t].id, label: ''}))});
  S.view = {x: 0, y: 0, k: 1}; sel = null; align(false);
});

// ---------- init ----------
const hadView = !!S.view;
if (!S.view) S.view = {x: innerWidth / 2, y: innerHeight / 2, k: 1};
renderAll(); applyView();
if (!hadView) fit();
applySide(); renderFileBtn(); restoreFile();
</script>
